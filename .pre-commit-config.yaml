---
# Pre-commit hooks configuration
# Install: pre-commit install
# Update: pre-commit autoupdate
# Run manually: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: normalize-dashes
        name: Normalize Unicode dashes
        entry: python scripts/pre-commit/normalize_dashes.py
        language: python
        language_version: python3.14
        types: [text]
        exclude: '(^|/)(\.git|node_modules|\.venv|venv|__pycache__|\.tox|\.mypy_cache|\.pytest_cache|\.ruff_cache)(/|$)'
        stages: [pre-commit]

      # Changed-code structural analysis for JavaScript, TypeScript, and CSS.
      # The script skips cleanly when the repository does not use Fallow.
      - id: fallow-audit
        name: Fallow audit (changed code only)
        entry: scripts/pre-commit/fallow_audit.sh
        language: system
        pass_filenames: false
        files: '\.(js|jsx|mjs|cjs|ts|tsx|css|scss)$'
        stages: [pre-commit]

      # Use an installed golangci-lint binary instead of compiling the upstream
      # Go-language hook. The script skips cleanly when Go tooling is absent.
      - id: golangci-lint
        name: golangci-lint (changed Go code)
        entry: scripts/pre-commit/golangci_lint.sh
        language: system
        pass_filenames: false
        files: '\.go$'
        stages: [pre-commit]

      - id: golangci-config-verify
        name: golangci-lint configuration
        entry: scripts/pre-commit/golangci_lint.sh --config-verify
        language: system
        pass_filenames: false
        files: '(^|/)\.golangci\.ya?ml$'
        stages: [pre-commit]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        exclude: '\.md$'  # Preserve trailing spaces in Markdown

      - id: end-of-file-fixer
        name: Fix end of files
        exclude: '\.mdc$'

      - id: check-yaml
        name: Check YAML syntax

      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']

      - id: mixed-line-ending
        name: Fix mixed line endings
        args: ['--fix=lf']

      - id: check-case-conflict
        name: Check for case conflicts

      - id: check-merge-conflict
        name: Check for merge conflicts

      - id: detect-private-key
        name: Detect private keys

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args: ['--fix', '--config', '.markdownlint.yaml']

  # Link checking (manual - can be slow/flaky depending on network)
  - repo: https://github.com/lycheeverse/lychee
    rev: v0.15.1
    hooks:
      - id: lychee
        name: Lychee (link checker)
        stages: [manual]
        files: '\.(md|mdc)$'
        args:
          - --no-progress
          - --max-retries
          - '2'
          - --timeout
          - '20'

  # Markdown link checking (optional - can be slow)
  # Uncomment if you want to check for broken links
  # - repo: https://github.com/tcort/markdown-link-check
  #   rev: v3.11.2
  #   hooks:
  #     - id: markdown-link-check
  #       name: Check Markdown links
  #       args: ['--config', '.markdown-link-check.json']

# Optional: Configure which files to include/exclude
# files: ''
# exclude: ''

# Optional: Fail fast - stop on first error
fail_fast: false

# Optional: Default language version
default_language_version:
  python: python3
