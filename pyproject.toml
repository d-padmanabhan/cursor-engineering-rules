[project]
name = "agent-engineering-handbook-tools"
version = "0.1.0"
description = "Local validation and hook tooling for the Agent Engineering Handbook"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.main]
py-version = "3.14"

[dependency-groups]
dev = [
    "pylint>=4.0.6",
    "ruff>=0.16.0",
]
eval = [
    "cursor-sdk>=1.0.27",
]
